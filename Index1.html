<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We'll Be Back Soon</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #0f172a;
        position: relative;
        color: #fff;
      }

      /* Animated Background */
      body::before {
        content: "";
        position: absolute;
        width: 700px;
        height: 700px;
        background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
        top: -250px;
        left: -200px;
        opacity: 0.25;
        animation: float 8s ease-in-out infinite alternate;
      }

      body::after {
        content: "";
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
        bottom: -220px;
        right: -180px;
        opacity: 0.2;
        animation: float2 10s ease-in-out infinite alternate;
      }

      @keyframes float {
        from {
          transform: translateY(0) translateX(0);
        }
        to {
          transform: translateY(60px) translateX(50px);
        }
      }

      @keyframes float2 {
        from {
          transform: translateY(0) translateX(0);
        }
        to {
          transform: translateY(-50px) translateX(-60px);
        }
      }

      .card {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 700px;
        padding: 60px 50px;
        text-align: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        border-radius: 28px;
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.45),
          inset 0 0 20px rgba(255, 255, 255, 0.05);
      }

      .icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 30px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        box-shadow: 0 0 30px rgba(59, 130, 246, 0.45);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 20px rgba(59, 130, 246, 0.45);
        }
        50% {
          transform: scale(1.08);
          box-shadow: 0 0 40px rgba(59, 130, 246, 0.8);
        }
      }

      .icon svg {
        width: 42px;
        fill: white;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 18px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .highlight {
        background: linear-gradient(90deg, #60a5fa, #22d3ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        color: #cbd5e1;
        font-size: 1.15rem;
        line-height: 1.8;
        max-width: 520px;
        margin: auto;
      }

      .loader {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 40px;
      }

      .loader span {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #38bdf8;
        animation: bounce 1.4s infinite;
      }

      .loader span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loader span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        40% {
          transform: translateY(-14px);
          opacity: 1;
        }
      }

      .footer {
        margin-top: 40px;
        color: #94a3b8;
        font-size: 0.95rem;
      }

      @media (max-width: 600px) {
        .card {
          padding: 40px 25px;
        }

        h1 {
          font-size: 2.2rem;
        }

        p {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5v5.3l3.6 2.1-.8 1.4L11 13V7h2z"
          />
        </svg>
      </div>

      <h1>We'll Be Back <span class="highlight">Soon</span></h1>

      <p>
        We are currently performing maintenance to improve your experience.
        <br /><br />
        <strong>We will be back as soon as possible.</strong>
        <br />
        Thank you for your patience and understanding.
      </p>

      <div class="loader">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="footer">© 2026 • Please check back shortly</div>
    </div>
  </body>
</html>
